<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoReport · 工單查找與品質分析</title>
<style>
[hidden]{display:none!important}
:root{color-scheme:light;--ink:#17324a;--muted:#64778a;--teal:#117b73;--teal-dark:#0d665f;--line:#dce6ed;--paper:#fff;--canvas:#f2f6f8;--blue:#3469cd;--shadow:0 14px 36px rgba(19,49,70,.075);font-family:Inter,"Noto Sans TC","PingFang TC",system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--canvas);font-synthesis:none;text-rendering:optimizeLegibility}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:24px}body{margin:0;background:radial-gradient(ellipse at 86% 0%,#e7f2f1 0,transparent 34rem),var(--canvas)}main{max-width:1320px;margin:0 auto;padding:40px 28px 70px}
.hero{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:210px;padding:34px 40px;border-radius:24px;background:linear-gradient(115deg,#163a56 0%,#1c5367 57%,#157c75 100%);box-shadow:0 22px 44px rgba(22,58,86,.18);color:#fff}.hero:after{content:"";position:absolute;width:320px;height:320px;right:16%;top:-188px;border:1px solid rgba(255,255,255,.14);border-radius:50%;box-shadow:0 0 0 35px rgba(255,255,255,.025),0 0 0 75px rgba(255,255,255,.025)}.hero>div,.hero-link{position:relative;z-index:1}.hero .label{color:#9fe1d6}.hero h1{font-size:clamp(30px,4vw,46px);letter-spacing:.02em;margin:9px 0}.hero p{margin:8px 0 0;color:#d5e5eb;font-size:16px}.hero-link{flex:0 0 auto;padding:12px 16px;border:1px solid rgba(255,255,255,.4);border-radius:12px;color:white;text-decoration:none;background:rgba(255,255,255,.08);transition:.2s}.hero-link:hover{background:rgba(255,255,255,.16);transform:translateY(-2px)}
.label,.section-kicker{font-size:11px;letter-spacing:.16em;font-weight:800;color:var(--teal)}.quick-nav{position:sticky;top:10px;z-index:5;display:flex;gap:8px;overflow:auto;padding:10px;margin:16px 0 20px;border:1px solid rgba(211,224,231,.9);border-radius:16px;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);box-shadow:0 6px 20px rgba(20,49,69,.05)}.quick-nav a{white-space:nowrap;padding:9px 14px;border-radius:10px;color:#496174;font-size:14px;text-decoration:none;transition:.18s}.quick-nav a:hover,.quick-nav a:focus-visible{background:#e9f4f2;color:var(--teal-dark);outline:none}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:28px;margin-top:18px;box-shadow:var(--shadow);scroll-margin-top:80px}.panel h2{font-size:23px;letter-spacing:.01em;margin:7px 0 12px}.panel h3{font-size:17px}.panel>p{max-width:1000px}p{color:var(--muted);line-height:1.75;margin:10px 0}.section-kicker{margin-bottom:4px}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}input,select,button{font:inherit;padding:12px 15px;border:1px solid #cad7e1;border-radius:11px;background:white;color:var(--ink);transition:border-color .18s,box-shadow .18s,transform .18s}input[type=text]{flex:1;min-width:160px}input:focus,select:focus,button:focus-visible{outline:none;border-color:#40a298;box-shadow:0 0 0 4px rgba(17,123,115,.12)}input[type=file]{max-width:100%;color:#667b8c;padding:7px}input[type=file]::file-selector-button{font:inherit;font-weight:650;padding:9px 12px;margin-right:10px;border:1px solid #c4d8d4;border-radius:8px;background:#f1f8f6;color:#176f68;cursor:pointer}input[type=file]::file-selector-button:hover{background:#e5f3ef}button{background:var(--teal);color:white;border-color:var(--teal);font-weight:650;cursor:pointer}button:hover:not(:disabled){background:var(--teal-dark);border-color:var(--teal-dark);transform:translateY(-1px)}button.secondary{background:#fff;color:var(--teal-dark);border-color:#9fc9c4}button.secondary:hover:not(:disabled){background:#eff8f6}.row button{min-height:46px}button:disabled{opacity:.55;cursor:wait;transform:none}a{color:var(--teal-dark)}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:20px 0}.metric{background:linear-gradient(145deg,#f5faf9,#edf5f5);border:1px solid #dfebea;padding:17px 18px;border-radius:15px}.metric strong{display:block;color:var(--ink);font-size:clamp(22px,2.5vw,30px);letter-spacing:-.02em}.metric span{display:block;margin-top:5px;color:#647b83;font-size:13px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:12px 10px;text-align:left;border-bottom:1px solid #e6edf1;vertical-align:top}th{background:#f3f7f9;white-space:nowrap}.scroll{overflow:auto}details{font-size:13px;color:#54677b;max-width:420px}summary{cursor:pointer}.ok{color:#13776b}.warn{color:#a56014}#message{margin-top:16px;white-space:pre-wrap;font-weight:600}#searchResults,#uploadResults{margin-top:18px}.muted{font-size:13px;color:#738494}.badge{display:inline-block;border-radius:999px;background:#e6f5f2;padding:6px 11px;font-size:12px;color:#12756d;font-weight:650}footer{font-size:13px;color:#7b8c98;padding:28px 0 8px;border-top:1px solid var(--line);margin-top:28px}
.dashboard-panel{border-color:#d6e5e5;background:linear-gradient(180deg,#fbfdfd 0,#fff 250px)}#qualityPeriod{max-width:none;padding:12px 15px;border-radius:12px;background:#f1f7f7;color:#527078}.dashboard-panel>p label{font-weight:650;color:var(--ink)}#qualityProduct{margin-left:8px;min-width:min(380px,70vw)}.stage-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.stage-card{min-width:0;border:1px solid #e0e9ee;border-radius:17px;padding:18px;background:#fff;box-shadow:0 7px 21px rgba(20,49,69,.045)}.stage-card:first-child{grid-column:1/-1}.stage-card h3{margin:0;font-size:17px;color:#234359}.stage-card .muted{margin:8px 0 0}.chart-head{justify-content:space-between;align-items:center}.chart-head button{padding:9px 12px;min-height:40px;font-size:13px}.stage-chart-scroll{width:100%;overflow-x:auto;overflow-y:hidden;margin-top:2px;border-radius:10px;scrollbar-color:#b8d0cd #f0f5f5;scrollbar-width:thin}.stage-card canvas{display:block;width:100%;height:320px;cursor:crosshair;margin-top:2px}.stage-card canvas:focus-visible{outline:3px solid rgba(52,105,205,.4);border-radius:8px}#qualitySelection{min-height:25px;margin-top:15px;padding:10px 14px;border-left:3px solid var(--blue);background:#f5f8fc;border-radius:0 10px 10px 0;color:#456078}
#yieldResult,#mergeResult,#matchedMergeResult,#autoResult{margin-top:16px;padding:13px 16px;border:1px solid #d6e8e4;border-radius:12px;background:#f0f8f6}#yieldDownload,#mergeDownload,#matchedMergeDownload,#autoDownload{display:inline-flex;align-items:center;gap:8px;font-weight:700;text-decoration:none}#yieldDownload:hover,#mergeDownload:hover,#matchedMergeDownload:hover,#autoDownload:hover{text-decoration:underline}.stage-grid{scroll-margin-top:18px}
@media(max-width:760px){main{padding:20px 14px 42px}.hero{align-items:flex-start;flex-direction:column;padding:27px 23px;min-height:0;border-radius:19px}.hero-link{font-size:13px}.quick-nav{top:4px}.panel{padding:21px 17px;border-radius:17px}.panel h2{font-size:21px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.metric{padding:13px}.metric strong{font-size:22px}.stage-grid{grid-template-columns:1fr}.stage-card:first-child{grid-column:auto}.stage-card{padding:13px}.stage-card canvas{height:280px}.chart-head{align-items:flex-start}.chart-head button{max-width:145px;line-height:1.3}}

.hero{min-height:145px;padding:26px 34px}.hero h1{font-size:34px}.panel{padding:23px}.panel h2{font-size:21px;margin:0 0 16px}.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.tool-grid .panel{min-width:0}.tool-grid input[type=file]{width:100%}.stage-card:first-child{grid-column:auto}#qualityPeriod{padding:0;background:transparent;margin:10px 0}#qualitySelection:empty,#defectStatus:empty{display:none}.defect-panel{border-top:1px solid var(--line);margin-top:26px;padding-top:26px}.defect-filters{margin:18px 0}.defect-filters select{min-width:160px;flex:1}.breadcrumbs{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0}.breadcrumbs button{font-size:13px;padding:7px 10px;background:#eef6f5;color:var(--teal);border:1px solid #d1e4df}.defect-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:9px;max-height:320px;overflow:auto;margin-top:12px}.defect-group{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#f8fafb;color:var(--ink);border:1px solid #dce6ed;text-align:left;font-size:13px;font-weight:500}.defect-group strong{white-space:nowrap;color:#bd4646}.defect-group:hover:not(:disabled){background:#eef6f4;color:var(--ink)}#defectChart{height:320px;display:block;cursor:pointer}#defectReconcile{font-size:13px;color:#5e7584}.imported-files{max-width:none;margin-top:18px}.imported-files summary{font-size:15px;font-weight:650;margin-bottom:16px}dialog{width:min(1180px,94vw);border:1px solid #dce6ed;border-radius:20px;padding:25px;max-height:86vh;box-shadow:0 30px 100px #17324a38}dialog::backdrop{background:#17324a70;backdrop-filter:blur(4px)}dialog .scroll{max-height:52vh;margin:16px 0}dialog input{width:100%}.dialog-pager{justify-content:center}p[role=status]:empty{display:none}.metrics .metric:only-child{grid-column:1/-1}
@media(max-width:900px){.tool-grid{grid-template-columns:1fr}.hero{padding:22px}.stage-grid{grid-template-columns:1fr}.chart-head{gap:14px}#qualityProduct{max-width:68vw;min-width:0}.defect-filters select{width:100%}.defect-groups{grid-template-columns:1fr}.hero h1{font-size:29px}.panel{padding:18px}}

.chart-pager{justify-content:flex-end;margin:8px 0}.chart-pager button{padding:5px 11px}.chart-pager output{font-size:13px;color:var(--muted)}
</style>
<main>
<header class="hero"><div><div class="label">AUTOREPORT</div><h1>工單與品質分析</h1></div><a class="hero-link" href="./autoreport.sqlite3" download>下載 SQLite ↗</a></header>
<nav class="quick-nav" aria-label="頁面導覽"><a href="#matching">資料比對</a><a href="#merge">合併去重</a><a href="#yield">每日良率</a><a href="#qualityDashboard">品質看板</a><a href="#database">資料庫</a></nav>
<div id="databaseMetrics" class="metrics" hidden><div class="metric"><strong id="sheetCount">—</strong><span>已匯入分頁</span></div><div class="metric"><strong id="orderCount">—</strong><span>不重複工單</span></div><div class="metric"><strong id="pairCount">—</strong><span>IC／機種組合</span></div></div>
<section class="panel"><h2>單筆查找</h2><form id="queryForm" class="row"><select id="kind" aria-label="查找欄位"><option value="any">自動辨識</option><option value="order">工單號碼</option><option value="part">產品料號</option><option value="dpn">DPN／客戶品號</option><option value="model">機種／產品系列</option><option value="ic">IC／機型</option></select><input id="query" type="text" required placeholder="工單、料號、DPN、IC 或機種" aria-label="查找值"><button id="lookup" disabled>查找</button><button type="button" id="fulltext" disabled class="secondary">文字搜尋</button></form><div id="searchResults"></div></section>
<section id="matching" class="panel"><h2>上傳檔案批次比對</h2><div class="row"><input id="file" type="file" multiple accept=".xlsx,.csv" aria-label="需要比對的檔案（可多選）"><button id="autoAnalyze" type="button">一鍵比對、合併與分析</button><button id="match" disabled>開始比對</button><button id="export" class="secondary" disabled>匯出 Excel</button><button id="mergeMatched" class="secondary" disabled>合併比對後的 Detail</button><a href="./downloads/AutoReport_query_template.xlsx" download>查詢範本</a></div><div id="message" role="status" aria-live="polite">正在載入對照資料…</div><p id="matchedMergeMessage" role="status" aria-live="polite"></p><p id="autoResult" hidden><a id="autoDownload" download>下載完整分析報表</a></p><p id="matchedMergeResult" hidden><a id="matchedMergeDownload" download>下載合併後的 Detail</a></p><div id="uploadResults"></div></section>
<div class="tool-grid"><section id="merge" class="panel"><h2>Detail 合併</h2><div class="row"><input id="mergeFiles" type="file" accept=".xlsx" multiple aria-label="直接合併的 Detail 檔案"><button id="mergeDirect">直接合併 Detail</button></div><p id="mergeMessage" role="status" aria-live="polite"></p><div id="mergeResult" hidden><div id="mergeStats" class="metrics"></div><a id="mergeDownload" download>下載合併檔案</a></div></section><section id="yield" class="panel"><h2>每日良率與不良分析</h2><div class="row"><input id="yieldFile" type="file" accept=".xlsx" aria-label="每日良率主檔"><button id="yieldCalculate">計算良率與不良分析</button></div><p id="yieldMessage" role="status" aria-live="polite"></p><div id="yieldResult" hidden><a id="yieldDownload" download>下載良率報表</a></div></section></div>
<section id="qualityDashboard" class="panel dashboard-panel" hidden><div class="row chart-head"><h2>品質分析看板</h2><label>產品 <select id="qualityProduct" aria-label="品質分析產品"></select></label></div><p id="qualityPeriod" class="muted"></p><div id="qualityMetrics" class="metrics"></div>
<div class="stage-grid"><article class="stage-card"><div class="row chart-head"><h3>前段（DAF＋FT1）</h3><button id="download-前段" type="button" class="secondary">下載 Excel 圖表</button></div><p id="summary-前段" class="muted"></p><div class="stage-chart-scroll"><canvas id="stage-前段" aria-label="前段每日良率圖表"></canvas></div></article><article class="stage-card"><div class="row chart-head"><h3>後段（ASM＋FT2）</h3><button id="download-後段" type="button" class="secondary">下載 Excel 圖表</button></div><p id="summary-後段" class="muted"></p><div class="stage-chart-scroll"><canvas id="stage-後段" aria-label="後段每日良率圖表"></canvas></div></article></div><p id="qualitySelection" role="status" aria-live="polite" hidden></p>
<section class="defect-panel"><div class="row chart-head"><h2>完整不良分析</h2><div class="row"><button id="defectOpen" type="button" class="secondary">查看 PPID 明細</button><button id="defectDownload" type="button">下載完整不良分析 Excel</button></div></div><div class="row defect-filters"><select id="defectDate" aria-label="不良分析日期"></select><select id="defectProcess" aria-label="不良分析製程"></select><select id="defectItem" aria-label="不良分析項目"></select><button id="defectReset" type="button" class="secondary">重設篩選</button></div><nav id="defectBreadcrumb" class="breadcrumbs" aria-label="不良分析層級"></nav><div id="defectTotals" class="metrics"></div><div class="row chart-head"><h3 id="defectTitle">產品不良率貢獻</h3><output id="defectReconcile"></output></div><div class="row chart-pager"><button id="defectChartPrev" aria-label="上一頁圖表" type="button" class="secondary">←</button><output id="defectChartPage"></output><button id="defectChartNext" aria-label="下一頁圖表" type="button" class="secondary">→</button></div><div class="stage-chart-scroll"><canvas id="defectChart" aria-label="不良率貢獻拆解圖表"></canvas></div><div id="defectGroups" class="defect-groups"></div><p id="defectStatus" role="status" aria-live="polite" hidden></p></section></section>
<div id="thresholdDashboard" hidden></div>
<section id="database" class="panel"><h2>本瀏覽器資料庫</h2><div class="row"><input id="databaseFile" type="file" accept=".xlsx" aria-label="資料庫原始對照檔"><button id="databaseUpload" type="button" disabled>上傳並更新本瀏覽器資料庫</button><button id="databaseDownload" type="button" class="secondary">下載目前 SQLite 資料庫</button><button id="databaseClear" type="button" class="secondary" disabled>清空本瀏覽器資料庫</button></div><p id="databaseStatus" role="status" aria-live="polite"></p><details class="imported-files"><summary>已匯入檔案</summary><div class="row"><input id="uploadedFileFilter" type="text" placeholder="搜尋檔名" aria-label="搜尋已上傳檔名"><button id="refreshUploadedFiles" type="button" class="secondary">重新整理清單</button></div><p id="uploadedFilesStatus" role="status" aria-live="polite"></p><div id="uploadedFiles"></div><p id="databaseUpdated" class="muted"></p></details></section>
<div id="sources" hidden></div><noscript>請啟用 JavaScript。</noscript>
<dialog id="defectDetails"><div class="row chart-head"><h2>不良 PPID 明細</h2><button id="defectClose" type="button" class="secondary" aria-label="關閉 PPID 明細">關閉</button></div><input id="defectSearch" type="search" placeholder="搜尋 PPID、不良項目" aria-label="搜尋不良 PPID"><div id="defectDetailTable" class="scroll"></div><div class="row dialog-pager"><button id="defectPrev" class="secondary" type="button">上一頁</button><output id="defectPage"></output><button id="defectNext" class="secondary" type="button">下一頁</button></div></dialog>
</main>
<script type="module" src="./assets/app.js"></script>
</html>

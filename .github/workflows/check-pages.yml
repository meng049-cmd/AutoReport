name: Check website
on:
  push:
    branches: [main, codex/autoreport-database]
    paths-ignore: ['database-inputs/**', 'data/**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements.txt
      - run: .venv/bin/python -m unittest -v
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node --test cloud/cloud-sync.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Verify manual IC and model corrections
        run: node --test web/match-corrections.browser.test.mjs
      - run: node --test cloud/cloud-sync.browser.test.mjs cloud/auth-gate.browser.test.mjs
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages-website
          path: dist
          include-hidden-files: true
      - name: Wait for deployed website
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/autoreport-database'
        run: .venv/bin/python web/wait_pages.py
      - name: Verify live upload and download
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/autoreport-database'
        env:
          LIVE_SITE_URL: https://meng049-cmd.github.io/AutoReport/
        run: npm run test:browser
